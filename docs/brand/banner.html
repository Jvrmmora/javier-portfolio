<!doctype html>
<!--
  Banner de portada (README de perfil de GitHub y LinkedIn). Misma identidad que el sitio:
  tokens de src/styles/global.css, Inter para los titulares, Geist Mono para lo técnico y los
  textos de src/data/profile.ts (si cambian allí, se cambian aquí).

  Formatos (por parámetro en la URL):
    ?f=linkedin  1584×396  la foto de perfil tapa la esquina inferior izquierda: el texto va a la derecha
    ?f=github    1500×500  texto a la izquierda y el diagrama a la derecha, como el hero
    &l=en        textos en inglés

  Para regenerar los PNG: servir la raíz del repo (las fuentes salen de node_modules; el
  puerto 4321 es el de Astro) y capturar con la ventana del tamaño exacto del formato:
    python3 -m http.server 4399
    http://localhost:4399/docs/brand/banner.html?f=linkedin       → banner-linkedin.png    (dsf 2)
    http://localhost:4399/docs/brand/banner.html?f=linkedin&l=en  → banner-linkedin-en.png (dsf 2)
    http://localhost:4399/docs/brand/banner.html?f=github         → banner-github.png      (dsf 1.4)
    http://localhost:4399/docs/brand/banner.html?f=github&l=en    → banner-github-en.png   (dsf 1.4)
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banner Javier Montaño</title>
<style>
  @font-face {
    font-family: 'Inter Variable';
    font-style: normal;
    font-display: block;
    font-weight: 100 900;
    src: url(../../node_modules/@fontsource-variable/inter/files/inter-latin-opsz-normal.woff2) format('woff2-variations');
  }
  @font-face {
    font-family: 'Geist Mono Variable';
    font-style: normal;
    font-display: block;
    font-weight: 100 900;
    src: url(../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format('woff2-variations');
  }

  /* Los mismos tokens del sitio (modo oscuro). */
  :root {
    --bg: #0a1628;
    --surface: #10203a;
    --bar: #0d1b32;
    --text: #f0f4f8;
    --muted: #8296b0;
    --accent: #f59e0b;
    --on-accent: #0a1628;
    --line: #1e3151;
    --amber-soft: rgb(245 158 11 / 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--text);
    font-family: 'Inter Variable', -apple-system, system-ui, sans-serif;
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
  }
  [data-en] { display: none; }
  .en [data-en] { display: inline; }
  .en [data-es] { display: none; }

  .stage { position: relative; overflow: hidden; isolation: isolate; background: var(--bg); }
  .linkedin .stage { width: 1584px; height: 396px; --gx: 33%; }
  .github .stage { width: 1500px; height: 500px; --gx: 80%; }

  /* Rejilla de puntos de plano técnico: solo alrededor del diagrama, se apaga hacia los bordes. */
  .grid {
    position: absolute; inset: 0; z-index: -2;
    background-image: radial-gradient(circle, rgb(130 150 176 / 0.28) 1.2px, transparent 1.8px);
    background-size: 26px 26px;
    background-position: 13px 13px;
    -webkit-mask-image: radial-gradient(ellipse 34% 85% at var(--gx) 50%, #000 15%, transparent 78%);
    mask-image: radial-gradient(ellipse 34% 85% at var(--gx) 50%, #000 15%, transparent 78%);
  }
  /* El ámbar entra como resplandor (igual que .contact-glow), nunca como relleno de fondo. */
  .glow {
    position: absolute; inset: 0; z-index: -1;
    background:
      radial-gradient(30% 75% at var(--gx) 50%, rgb(245 158 11 / 0.13), transparent 70%),
      radial-gradient(40% 70% at 96% 0%, rgb(245 158 11 / 0.07), transparent 70%),
      linear-gradient(to bottom, transparent 55%, rgb(8 18 33 / 0.6));
  }

  /* ---------- Texto: el titular es el sitio. En LinkedIn el nombre ya sale debajo del
     banner, así que aquí el nombre y el cargo van de antetítulo y el dominio manda. ---------- */
  .copy { position: absolute; top: 50%; transform: translateY(-50%); }
  .linkedin .copy { right: 64px; }
  .github .copy { left: 96px; }

  .status { display: flex; align-items: center; gap: 12px; color: var(--muted); letter-spacing: -0.005em; }
  .status .dot { position: relative; width: 10px; height: 10px; border-radius: 99px; background: var(--accent); }
  .status .dot::after { content: ''; position: absolute; inset: -5px; border-radius: inherit; background: var(--accent); opacity: 0.22; }
  .linkedin .status { font-size: 18px; }
  .github .status { font-size: 20px; }

  .kicker { display: flex; align-items: center; gap: 14px; font-weight: 700; letter-spacing: -0.02em; white-space: nowrap; }
  .kicker .bar { width: 4px; border-radius: 99px; background: var(--accent); }
  .kicker .role { color: var(--accent); }
  .linkedin .kicker { font-size: 27px; margin-top: 18px; }
  .linkedin .kicker .bar { height: 26px; }
  .github .kicker { font-size: 32px; margin-top: 22px; }
  .github .kicker .bar { height: 30px; }

  .url { display: flex; align-items: center; font-weight: 700; letter-spacing: -0.045em; line-height: 1; white-space: nowrap; }
  .url .tld { color: var(--accent); }
  .linkedin .url { font-size: 80px; margin-top: 10px; }
  .github .url { font-size: 92px; margin-top: 14px; }
  /* El botón del sitio (relleno ámbar, tinta navy): dice "esto se abre". */
  .go {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    margin-left: 20px; border-radius: 16px; background: var(--accent); color: var(--on-accent);
    box-shadow: 0 0 0 6px rgb(245 158 11 / 0.12), 0 14px 32px -10px rgb(245 158 11 / 0.45);
  }
  .go svg { width: 55%; height: 55%; }
  .linkedin .go { width: 60px; height: 60px; }
  .github .go { width: 70px; height: 70px; border-radius: 18px; }

  .sub { display: flex; align-items: center; gap: 14px; color: var(--muted); letter-spacing: -0.005em; white-space: nowrap; }
  .sub i { font-style: normal; color: var(--line); }
  .sub b { font-weight: 600; color: var(--text); }
  .linkedin .sub { font-size: 19px; margin-top: 20px; }
  .github .sub { font-size: 21px; margin-top: 26px; }

  /* ---------- Diagrama: una petición entra al API y el API habla con datos, nube y despliegue ---------- */
  .diagram { position: absolute; width: 470px; height: 300px; }
  .linkedin .diagram { left: 318px; top: 48px; transform: scale(0.9); transform-origin: left center; }
  .github .diagram { left: 976px; top: 100px; }
  .diagram > svg.edges { position: absolute; inset: 0; overflow: visible; }

  .pill {
    position: absolute; display: inline-flex; align-items: center; gap: 8px;
    height: 34px; padding: 0 13px; border-radius: 9px;
    font-family: 'Geist Mono Variable', ui-monospace, monospace; font-size: 14px; letter-spacing: -0.01em;
    border: 1px solid var(--line); background: var(--bar); color: var(--text); white-space: nowrap;
  }
  .pill .verb { color: var(--accent); font-weight: 600; }
  .pill.ok { border-color: rgb(245 158 11 / 0.45); background: rgb(245 158 11 / 0.1); color: var(--accent); font-weight: 600; }
  .pill.ok::before { content: ''; width: 7px; height: 7px; border-radius: 99px; background: var(--accent); }

  .node {
    position: absolute; display: flex; align-items: center; justify-content: center;
    border-radius: 18px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
    box-shadow: 0 14px 34px -14px rgb(0 0 0 / 0.6);
  }
  .node svg { display: block; }
  .node.api {
    width: 92px; height: 92px; border-radius: 22px; border: 2px solid var(--accent); color: var(--accent);
    box-shadow: 0 0 0 7px rgb(245 158 11 / 0.1), 0 18px 40px -12px rgb(245 158 11 / 0.35);
  }
  .node.api svg { width: 46px; height: 46px; }
  .node.sm { width: 64px; height: 64px; }
  .node.sm svg { width: 30px; height: 30px; }
  .node.sm svg.wide { width: 38px; }
  .label {
    position: absolute; font-family: 'Geist Mono Variable', ui-monospace, monospace; font-size: 13px;
    color: var(--muted); white-space: nowrap; transform: translateX(-50%); letter-spacing: -0.01em;
  }
  .label.right { transform: translateY(-50%); }
</style>
</head>
